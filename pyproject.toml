[project]
name = "langchain-docs-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thomasmitchellboom", email = "thomas.mitchell@boomworks.com.au" }
]
requires-python = ">=3.12"
dependencies = [
    "atlassian-python-api>=5.0.5",
    "deepagents>=0.7.25",
    "docling-slim[format-pdf-docling]>=2.140.0",
    "dotenv>=0.9.9",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-community>=0.4.2",
    "langchain-docling[local]>=3.0.0",
    "langchain-huggingface[full]>=1.2.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-milvus>=0.4.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "milvus-lite>=3.2.2",
    "torch>=2.14.1",
]

[project.scripts]
langchain-docs-tutorial = "langchain_docs_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
